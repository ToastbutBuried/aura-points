// Shared setup for common/, neoforge/ and fabric/. Each loader project compiles common's sources and resources
// into its own jar (see commonSources() below), so common never ships as a jar of its own.
plugins {
	id 'net.neoforged.moddev' version '2.0.148' apply false
	id 'fabric-loom' version '1.17.21' apply false
}

subprojects {
	apply plugin: 'java-library'

	version = project.mod_version
	group = project.maven_group
	base.archivesName = "${project.archives_base_name}-${project.name}"

	java.toolchain.languageVersion = JavaLanguageVersion.of(21)

	repositories {
		mavenCentral()
		// GeckoLib
		maven { url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
		// Mixin annotations for common
		maven { url 'https://repo.spongepowered.org/repository/maven-public/' }
		maven { url 'https://maven.fabricmc.net/' }
		// Player Animator, Puffish's Skills + Attributes (Modrinth: maven.modrinth:<project>:<version id>)
		exclusiveContent {
			forRepository { maven { url 'https://api.modrinth.com/maven' } }
			filter { includeGroup 'maven.modrinth' }
		}
		// FTB Quests / Teams / Library (Fabric dev runs only; the mod talks to them by reflection)
		exclusiveContent {
			forRepository { maven { url 'https://maven.ftb.dev/releases' } }
			filter { includeGroup 'dev.ftb.mods' }
		}
		exclusiveContent {
			forRepository { maven { url 'https://maven.architectury.dev/' } }
			filter { includeGroup 'dev.architectury' }
		}
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.encoding = "UTF-8"
		it.options.release = 21
	}

	jar {
		manifest {
			attributes([
				"Specification-Title"  : project.archives_base_name,
				"Specification-Vendor" : "ToastbutBuried",
				"Implementation-Title" : project.archives_base_name,
				"Implementation-Version": project.version,
				"Implementation-Vendor": "ToastbutBuried"
			])
		}
	}
}

// Loader projects: add common's java + resources to their main source set, and list every class with an
// @EventBusSubscriber (shim) annotation in aurapoints-subscribers.txt, which shim/AuraBus registers at startup.
configure(subprojects.findAll { it.name != 'common' }) {
	def common = project(':common')
	sourceSets.main.java.srcDir common.file('src/main/java')
	sourceSets.main.resources.srcDir common.file('src/main/resources')
	sourceSets.main.resources.srcDir layout.buildDirectory.dir('generated/subscribers')

	def genSubscribers = tasks.register('generateSubscriberList') {
		def srcRoots = [common.file('src/main/java'), file('src/main/java')]
		def out = layout.buildDirectory.file('generated/subscribers/aurapoints-subscribers.txt')
		inputs.files(srcRoots.collect { fileTree(it) { include '**/*.java' } })
		outputs.file(out)
		doLast {
			def lines = []
			srcRoots.each { root ->
				fileTree(root) { include '**/*.java' }.each { f ->
					def text = f.text
					if (text =~ /(?m)^\s*@(?:com\.toast\.aurapoints\.shim\.fml\.common\.)?EventBusSubscriber\b/) {
						def rel = root.toPath().relativize(f.toPath()).toString().replace(File.separatorChar, '.' as char)
						lines << rel.substring(0, rel.length() - 5)
					}
					// nested static classes with the annotation (AuraPoints.GameEvents)
					(text =~ /(?m)^\s*@(?:com\.toast\.aurapoints\.shim\.fml\.common\.)?EventBusSubscriber\b[^\n]*\n\s*public static (?:final )?class (\w+)/).each { m ->
						def rel = root.toPath().relativize(f.toPath()).toString().replace(File.separatorChar, '.' as char)
						def outer = rel.substring(0, rel.length() - 5)
						lines.remove(outer)
						lines << outer + '$' + m[1]
					}
				}
			}
			def o = out.get().asFile
			o.parentFile.mkdirs()
			o.text = lines.unique().sort().join('\n') + '\n'
		}
	}
	tasks.named('processResources') { dependsOn genSubscribers }
}
