loaderVersion = "[1,)"
license = "LGPL-3.0-or-later"
issueTrackerURL = "https://github.com/ToastbutBuried/aura-points/issues"

[[mods]]
modId = "aurapoints"
version = "${version}"
displayName = "Aura Points"
authors = "ToastbutBuried"
displayURL = "https://github.com/ToastbutBuried/aura-points"
description = '''
Roll one of 12 auras (Shadow, Water, Fire, Wind, Frost, Verdant, Thunder, Resonance,
Earth, Light, Blood, Void) with /aura roll and buy its active abilities in /aura shop,
triggered with rebindable keys. Level an aura's Mastery, awaken its Ultimate, combine
auras in Team Combos, and test yourself in the arena (duels, matches, Wave Survival,
Training Hall). Aura - a scoreboard currency paid by quests, bosses and Trials - also
buys points for the built-in Puffish skill trees (/aura redeem; the PvP tree once you
have defeated a boss), cosmetics and rerolls. Weekly challenges, /changelog and player tickets
are built in.

Requires Pufferfish's Skills + Pufferfish's Attributes, GeckoLib, and on the client
Player Animator.
'''

